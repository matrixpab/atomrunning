<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00D2D3" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ATOM ORBITAL ICON (Left side) -->
  <g transform="translate(80, 80)">
    <!-- Outer energy ring -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="2" stroke-dasharray="4 6"/>
    
    <!-- First Orbit (Rotated -35 deg) -->
    <ellipse cx="0" cy="0" rx="54" ry="20" fill="none" stroke="url(#cyanGrad)" stroke-width="3.5" transform="rotate(-35)" filter="url(#neonGlow)"/>
    <circle cx="44" cy="-22" r="4" fill="#00F0FF" filter="url(#neonGlow)"/>

    <!-- Second Orbit (Rotated 35 deg) -->
    <ellipse cx="0" cy="0" rx="54" ry="20" fill="none" stroke="url(#cyanGrad)" stroke-width="3.5" transform="rotate(35)" filter="url(#neonGlow)"/>
    <circle cx="-42" cy="-24" r="4" fill="#38BDF8" filter="url(#neonGlow)"/>

    <!-- Third Orbit (Rotated 90 deg) -->
    <ellipse cx="0" cy="0" rx="50" ry="19" fill="none" stroke="rgba(56, 189, 248, 0.75)" stroke-width="2.5" transform="rotate(90)"/>
    <circle cx="0" cy="46" r="3.5" fill="#FFFFFF"/>

    <!-- Nucleus Center (Glowing athletic core) -->
    <circle cx="0" cy="0" r="14" fill="url(#cyanGrad)" filter="url(#neonGlow)"/>
    <circle cx="0" cy="0" r="7" fill="#FFFFFF"/>
    
    <!-- Motion dynamic speed tick -->
    <path d="M -8 -8 L 8 8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- TYPOGRAPHY: ATOM -->
  <text x="160" y="94" font-family="'Outfit', 'Plus Jakarta Sans', 'Arial Black', sans-serif" font-size="78" font-weight="900" letter-spacing="4" fill="#FFFFFF">
    A<tspan fill="url(#cyanGrad)">T</tspan>OM
  </text>

  <!-- SUBTITLE: CLUB DE RUNNING -->
  <text x="164" y="128" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="16" font-weight="700" letter-spacing="8" fill="#38BDF8">
    CLUB DE RUNNING
  </text>
  
  <!-- LOCATION BADGE -->
  <text x="164" y="146" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#94A3B8">
    LA DORMIDA · LA PAZ · MENDOZA
  </text>
</svg>

