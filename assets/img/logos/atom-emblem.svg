<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="atomCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00D2D3" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="atomGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="160" height="160" rx="36" fill="#000B14"/>
  <rect width="158" height="158" x="1" y="1" rx="35" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5"/>

  <!-- Orbital Rings System -->
  <g transform="translate(80, 80)">
    <!-- Outer guide ring -->
    <circle cx="0" cy="0" r="56" fill="none" stroke="rgba(0, 240, 255, 0.12)" stroke-width="1.5" stroke-dasharray="4 5"/>

    <!-- Orbit 1 (-35 deg) -->
    <ellipse cx="0" cy="0" rx="58" ry="22" fill="none" stroke="url(#atomCyanGrad)" stroke-width="3" transform="rotate(-35)" filter="url(#atomGlow)"/>
    <circle cx="48" cy="-24" r="4.5" fill="#00F0FF" filter="url(#atomGlow)"/>

    <!-- Orbit 2 (+35 deg) -->
    <ellipse cx="0" cy="0" rx="58" ry="22" fill="none" stroke="url(#atomCyanGrad)" stroke-width="3" transform="rotate(35)" filter="url(#atomGlow)"/>
    <circle cx="-46" cy="-26" r="4.5" fill="#38BDF8" filter="url(#atomGlow)"/>

    <!-- Orbit 3 (90 deg) -->
    <ellipse cx="0" cy="0" rx="54" ry="20" fill="none" stroke="rgba(56, 189, 248, 0.75)" stroke-width="2.5" transform="rotate(90)"/>
    <circle cx="0" cy="50" r="4" fill="#FFFFFF"/>

    <!-- Central Glowing Core -->
    <circle cx="0" cy="0" r="15" fill="url(#atomCyanGrad)" filter="url(#atomGlow)"/>
    <circle cx="0" cy="0" r="7.5" fill="#FFFFFF"/>
    <path d="M -9 -9 L 9 9" stroke="#000B14" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>

